# Example: supplying Komodo Core secrets and external database credentials
# through existing Secrets (the documented production path).
#
# 1. Database credentials.
#    In the cluster these come from the Percona `PerconaServerMongoDB` cluster
#    Secret created in jdogwilly/cluster-apps. For a hand-rolled database:
---
apiVersion: v1
kind: Secret
metadata:
  name: komodo-psmdb-credentials
type: Opaque
stringData:
  MONGODB_USER_ADMIN_USER: komodo
  MONGODB_USER_ADMIN_PASSWORD: "change-me"

# 2. Komodo secrets. Keys default to the KOMODO_* variable names; only the
#    keys you actually set need to exist (they are looked up with
#    `optional: true`).
---
apiVersion: v1
kind: Secret
metadata:
  name: komodo-secrets
type: Opaque
stringData:
  KOMODO_JWT_SECRET: "a-long-random-string"
  KOMODO_WEBHOOK_SECRET: "another-long-random-string"
  KOMODO_INIT_ADMIN_PASSWORD: "change-me"

# 3. Optional core config file. This is the ONLY way to provide a [secrets]
#    block, [[git_provider]] or [[image_registry]] entries - they cannot be
#    set through environment variables.
---
apiVersion: v1
kind: Secret
metadata:
  name: komodo-core-config
type: Opaque
stringData:
  config.toml: |
    [secrets]
    SECRET_1 = "value_1"

# Then in your values:
#
# komodo:
#   secrets:
#     existingSecret: komodo-secrets
# database:
#   address: komodo-psmdb-rs0.komodo.svc.cluster.local:27017
#   existingSecret: komodo-psmdb-credentials
#   usernameKey: MONGODB_USER_ADMIN_USER
#   passwordKey: MONGODB_USER_ADMIN_PASSWORD
# coreConfig:
#   existingSecret: komodo-core-config
#   key: config.toml
