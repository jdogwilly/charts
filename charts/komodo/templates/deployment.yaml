apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "komodo.fullname" . }}
  labels:
    {{- include "komodo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "komodo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or (include "komodo.createSecret" .) .Values.coreConfig.existingSecret .Values.podAnnotations }}
      annotations:
        {{- if include "komodo.createSecret" . }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- /* Surface the externally managed config Secret in `kubectl describe`.
               It is not checksummed: the chart does not own its contents. */}}
        {{- with .Values.coreConfig.existingSecret }}
        komodo.io/core-config-secret: {{ . | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "komodo.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "komodo.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9120
              protocol: TCP
          env:
            {{- with .Values.komodo.host }}
            - name: KOMODO_HOST
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.komodo.title }}
            - name: KOMODO_TITLE
              value: {{ . | quote }}
            {{- end }}
            - name: KOMODO_LOCAL_AUTH
              value: {{ .Values.komodo.localAuth | quote }}
            - name: KOMODO_DISABLE_USER_REGISTRATION
              value: {{ .Values.komodo.disableUserRegistration | quote }}
            {{- with .Values.komodo.initAdminUsername }}
            - name: KOMODO_INIT_ADMIN_USERNAME
              value: {{ . | quote }}
            {{- end }}
            - name: KOMODO_MONITORING_INTERVAL
              value: {{ .Values.komodo.monitoringInterval | quote }}
            - name: KOMODO_RESOURCE_POLL_INTERVAL
              value: {{ .Values.komodo.resourcePollInterval | quote }}
            - name: KOMODO_UI_WRITE_DISABLED
              value: {{ .Values.komodo.uiWriteDisabled | quote }}
            {{- with .Values.komodo.timezone }}
            - name: TZ
              value: {{ . | quote }}
            {{- end }}
            {{- /* Komodo secrets: from an existing Secret (documented path) or the chart managed one. */}}
            {{- if .Values.komodo.secrets.existingSecret }}
            {{- with .Values.komodo.secrets.jwtSecretKey }}
            - name: KOMODO_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.komodo.secrets.existingSecret }}
                  key: {{ . }}
                  optional: true
            {{- end }}
            {{- with .Values.komodo.secrets.webhookSecretKey }}
            - name: KOMODO_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.komodo.secrets.existingSecret }}
                  key: {{ . }}
                  optional: true
            {{- end }}
            {{- with .Values.komodo.secrets.initAdminPasswordKey }}
            - name: KOMODO_INIT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.komodo.secrets.existingSecret }}
                  key: {{ . }}
                  optional: true
            {{- end }}
            {{- else }}
            {{- if .Values.komodo.secrets.jwtSecret }}
            - name: KOMODO_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "komodo.secretName" . }}
                  key: KOMODO_JWT_SECRET
            {{- end }}
            {{- if .Values.komodo.secrets.webhookSecret }}
            - name: KOMODO_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "komodo.secretName" . }}
                  key: KOMODO_WEBHOOK_SECRET
            {{- end }}
            {{- if .Values.komodo.secrets.initAdminPassword }}
            - name: KOMODO_INIT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "komodo.secretName" . }}
                  key: KOMODO_INIT_ADMIN_PASSWORD
            {{- end }}
            {{- end }}
            {{- /* External database. Credentials from an existing Secret, or inline for dev. */}}
            {{- with .Values.database.address }}
            - name: KOMODO_DATABASE_ADDRESS
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.database.existingSecret }}
            - name: KOMODO_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.usernameKey }}
            - name: KOMODO_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.passwordKey }}
            {{- else }}
            {{- if .Values.database.username }}
            - name: KOMODO_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "komodo.secretName" . }}
                  key: KOMODO_DATABASE_USERNAME
            {{- end }}
            {{- if .Values.database.password }}
            - name: KOMODO_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "komodo.secretName" . }}
                  key: KOMODO_DATABASE_PASSWORD
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- include "komodo.probeHandler" .Values.livenessProbe | nindent 12 }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- include "komodo.probeHandler" .Values.readinessProbe | nindent 12 }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- include "komodo.probeHandler" .Values.startupProbe | nindent 12 }}
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            successThreshold: {{ .Values.startupProbe.successThreshold }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.keys.enabled }}
            - name: keys
              mountPath: /config/keys
            {{- end }}
            {{- if .Values.persistence.syncs.enabled }}
            - name: syncs
              mountPath: /syncs
            {{- end }}
            {{- if .Values.persistence.backups.enabled }}
            - name: backups
              mountPath: /backups
            {{- end }}
            {{- if .Values.coreConfig.existingSecret }}
            - name: core-config
              mountPath: /config/config.toml
              subPath: {{ .Values.coreConfig.key }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if .Values.persistence.keys.enabled }}
        - name: keys
          persistentVolumeClaim:
            claimName: {{ include "komodo.pvcName" (dict "root" $ "name" "keys" "config" .Values.persistence.keys) }}
        {{- end }}
        {{- if .Values.persistence.syncs.enabled }}
        - name: syncs
          persistentVolumeClaim:
            claimName: {{ include "komodo.pvcName" (dict "root" $ "name" "syncs" "config" .Values.persistence.syncs) }}
        {{- end }}
        {{- if .Values.persistence.backups.enabled }}
        - name: backups
          persistentVolumeClaim:
            claimName: {{ include "komodo.pvcName" (dict "root" $ "name" "backups" "config" .Values.persistence.backups) }}
        {{- end }}
        {{- if .Values.coreConfig.existingSecret }}
        - name: core-config
          secret:
            secretName: {{ .Values.coreConfig.existingSecret }}
            items:
              - key: {{ .Values.coreConfig.key }}
                path: {{ .Values.coreConfig.key }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
