{{- if include "komodo.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "komodo.secretName" . }}
  labels:
    {{- include "komodo.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* Inline database credentials - dev convenience only.
         Production installs should use `database.existingSecret`. */}}
  {{- with .Values.database.username }}
  KOMODO_DATABASE_USERNAME: {{ . | quote }}
  {{- end }}
  {{- with .Values.database.password }}
  KOMODO_DATABASE_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- /* Inline Komodo secrets - dev convenience only.
         Production installs should use `komodo.secrets.existingSecret`. */}}
  {{- with .Values.komodo.secrets.jwtSecret }}
  KOMODO_JWT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.komodo.secrets.webhookSecret }}
  KOMODO_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.komodo.secrets.initAdminPassword }}
  KOMODO_INIT_ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
