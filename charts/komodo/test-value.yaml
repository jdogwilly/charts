# Test values for the komodo chart.
#
# Exercises: both ingresses (Traefik LAN + Tailscale operator), an existing
# database Secret, the mounted core config.toml, and all three PVCs.
#
#   helm template charts/komodo -f charts/komodo/test-value.yaml

image:
  repository: ghcr.io/moghtech/komodo-core
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9120

komodo:
  host: "https://komodo.jacob.brookins.house"
  title: "Komodo"
  localAuth: true
  disableUserRegistration: true
  initAdminUsername: "jacob"
  monitoringInterval: "15-sec"
  resourcePollInterval: "1-hr"
  uiWriteDisabled: false
  timezone: "America/Los_Angeles"
  secrets:
    existingSecret: komodo-secrets

database:
  address: "komodo-psmdb-rs0.komodo.svc.cluster.local:27017"
  existingSecret: komodo-psmdb-credentials
  usernameKey: MONGODB_USER_ADMIN_USER
  passwordKey: MONGODB_USER_ADMIN_PASSWORD

coreConfig:
  existingSecret: komodo-core-config
  key: config.toml

persistence:
  keys:
    enabled: true
    storageClass: longhorn
    size: 1Gi
  syncs:
    enabled: true
    storageClass: longhorn
    size: 1Gi
  backups:
    enabled: true
    storageClass: longhorn
    size: 10Gi

ingresses:
  traefik:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hosts:
      - host: komodo.jacob.brookins.house
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: komodo-tls
        hosts:
          - komodo.jacob.brookins.house
  tailscale:
    enabled: true
    className: tailscale
    defaultBackend: true
    tls:
      - hosts:
          - komodo

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

extraEnv:
  - name: KOMODO_PERIPHERY_PUBLIC_KEY
    value: "file:/config/keys/periphery.pub"
